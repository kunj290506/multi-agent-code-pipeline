version: "3.9"

# ─────────────────────────────────────────────
#  Multi-Agent Code Pipeline — Infrastructure
#  Services: n8n · Ollama · ChromaDB (Local)
# ─────────────────────────────────────────────

services:

  # ── n8n: Visual workflow orchestration ──────
  n8n:
    image: n8nio/n8n:latest
    container_name: n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=admin
      - N8N_BASIC_AUTH_PASSWORD=changeme
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://localhost:5678/
      - GENERIC_TIMEZONE=Asia/Kolkata
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n:/home/node/.n8n/workflows   # persist exported workflow JSONs
    extra_hosts:
      - "host.docker.internal:host-gateway"   # Linux compatibility
    # depends_on:
    #   ollama:
    #     condition: service_healthy
    networks:
      - pipeline-net

  # ── Ollama: Local LLM inference (Disabled - running on host) ─────────────
  # ollama:
  #   image: ollama/ollama:latest
  #   container_name: ollama
  #   restart: unless-stopped
  #   ports:
  #     - "11434:11434"
  #   environment:
  #     - OLLAMA_HOST=0.0.0.0
  #   volumes:
  #     - ollama_data:/root/.ollama          # persist downloaded models
  #   healthcheck:
  #     test: ["CMD-SHELL", "curl -f http://localhost:11434/api/tags || exit 1"]
  #     interval: 15s
  #     timeout: 5s
  #     retries: 5
  #     start_period: 10s
  #   networks:
  #     - pipeline-net



# ─────────────────────────────────────────────
#  Named Volumes
# ─────────────────────────────────────────────
volumes:
  n8n_data:
  ollama_data:

# ─────────────────────────────────────────────
#  Networks
# ─────────────────────────────────────────────
networks:
  pipeline-net:
    driver: bridge
