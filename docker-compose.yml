version: "3.9"

# ─────────────────────────────────────────────
#  Multi-Agent Code Pipeline — Infrastructure
#  Services: n8n · Ollama · Qdrant
# ─────────────────────────────────────────────

services:

  # ── n8n: Visual workflow orchestration ──────
  n8n:
    image: n8nio/n8n:latest
    container_name: n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=admin
      - N8N_BASIC_AUTH_PASSWORD=changeme
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://localhost:5678/
      - GENERIC_TIMEZONE=Asia/Kolkata
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n:/home/node/.n8n/workflows   # persist exported workflow JSONs
    networks:
      - pipeline-net

  # ── Ollama: Local LLM inference ─────────────
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama          # persist downloaded models
    # GPU support (uncomment if NVIDIA GPU available):
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
    networks:
      - pipeline-net

  # ── Qdrant: Vector database for RAG agent ───
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"   # REST API
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - pipeline-net

# ─────────────────────────────────────────────
#  Named Volumes
# ─────────────────────────────────────────────
volumes:
  n8n_data:
  ollama_data:
  qdrant_data:

# ─────────────────────────────────────────────
#  Networks
# ─────────────────────────────────────────────
networks:
  pipeline-net:
    driver: bridge
